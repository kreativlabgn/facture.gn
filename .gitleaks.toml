# Vague 0 (C1) — configuration gitleaks. Étend le jeu de règles par défaut et
# tolère uniquement les faux positifs connus : les fichiers *.env.example ne
# contiennent que des placeholders (`EXAMPLE000…`) et un bloc PEM factice
# (`MIIExAMPLE…`) servant à documenter le format — jamais un vrai secret.
# Tout secret réel doit vivre dans un gestionnaire (Vault / sealed secrets),
# jamais dans le dépôt (voir CONTRIBUTING.md).
title = "facture.gn gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholders de documentation, jamais de vrais secrets"
paths = [
  '''.*\.env\.example$''',
  '''README\.md$''',
]
regexes = [
  '''EXAMPLE0+''',
  '''EXAMPLE1+''',
  '''MIIExAMPLE''',
  '''MIIBExAMPLE''',
]
