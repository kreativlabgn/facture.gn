packages:
  - "apps/*"
  - "packages/*"
# Security Audit 2026-08-23, finding #9 — CVE HIGH sans rapport avec un usage
# actif (multer : aucun endpoint d'upload construit à ce jour ; lodash/js-yaml :
# @nestjs/swagger, exposition indirecte via /docs uniquement) mais non patchées
# dans les dépendances directement bundlées — corrigées à la source plutôt que
# d'attendre une nouvelle version de @nestjs/swagger qui les référence.
overrides:
  multer@<2.2.0: ">=2.2.0"
  lodash@<4.17.24: ">=4.17.24"
  js-yaml@<4.3.1: ">=4.3.1"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true
