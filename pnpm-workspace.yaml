packages:
  - "apps/*"
  - "packages/*"
# Security Audit 2026-08-23, finding #9 — CVE HIGH sans rapport avec un usage
# actif (multer : aucun endpoint d'upload construit à ce jour ; lodash/js-yaml :
# @nestjs/swagger, exposition indirecte via /docs uniquement) mais non patchées
# dans les dépendances directement bundlées — corrigées à la source plutôt que
# d'attendre une nouvelle version de @nestjs/swagger qui les référence.
overrides:
  multer@<2.3.0: ">=2.3.0"
  lodash@<4.17.24: ">=4.17.24"
  js-yaml@<4.3.2: ">=4.3.2"
  # GHSA-vcvr-r3jv-pc5j (Next.js, exécution de code à distance dans
  # next/og ImageResponse, critique, publié le 30/09/2026) : corrigé en 16.3.6.
  # Aucun usage direct de next/og dans apps/web, mais Next est une dépendance
  # d'exécution — relevé sans attendre. Caret : on reste sur la ligne 16.x.
  # GHSA-cjq9-62q9-8jv4 (Next.js, SSRF dans l'optimisation d'images, haute,
  # publié le 07/10/2026) : corrigé en 16.3.8 — l'optimiseur est actif par défaut.
  next@<16.3.8: "^16.3.8"
  sharp@<0.35.4: ">=0.35.4"
  # GHSA-6j4f-fj2g-mc7p / GHSA-qhr7-859c-m2p7 (brace-expansion, DoS par récursion
  # non bornée) et GHSA-qw65-cvwx-89v3 (fast-uri, injection d'autorité via un port
  # non validé). Outillage seulement (eslint, typescript-eslint, @nestjs/cli) —
  # aucun chemin d'exécution en production. Une surcharge PAR LIGNE MAJEURE
  # (caret) : minimatch 3 / 9 / 10 attendent chacun sa propre API de
  # brace-expansion, un `>=` sans borne casserait l'une des trois.
  brace-expansion@<1.1.20: "^1.1.20"
  brace-expansion@>=2.0.0 <2.1.6: "^2.1.6"
  brace-expansion@>=4.0.0 <5.0.11: "^5.0.11"
  fast-uri@>=3.0.0 <3.1.7: "^3.1.7"
  # GHSA-m9gg-hp2v-232j (@grpc/grpc-js, certificats non autorisés présentés comme
  # autorisés dans certaines configurations TLS) — transitif via @nestjs/terminus
  # et l'exporter OTLP, publié le 30/09/2026.
  "@grpc/grpc-js@>=1.14.0 <1.14.5": "^1.14.5"
  # GHSA-jqcg-44mw-7w3h (proxy-addr, usurpation d'IP via un sous-réseau de
  # confiance IPv4 mappé IPv6, critique, publié le 05/10/2026) — Express, donc le
  # serveur HTTP des deux API. Non atteignable aujourd'hui (aucun `trust proxy`
  # configuré) mais le deviendrait derrière un ingress : relevé sans attendre.
  proxy-addr@<2.0.8: "^2.0.8"
  # GHSA-68fv-2mgg-jv7q (source-map-js, déni de service par offsets de sections,
  # haute, publié le 18/09/2026) — build et tests seulement : postcss (CSS de
  # next et de Tailwind au build, vite sous vitest) et magicast (couverture).
  source-map-js@>=1.0.0 <1.2.2: "^1.2.2"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  # Lot E — accélérateur natif optionnel de msgpackr (dépendance transitive de
  # bullmq). false : msgpackr utilise son implémentation JS pure (BullMQ
  # fonctionne à l'identique), et la CI n'a pas besoin d'un compilateur C++.
  msgpackr-extract: false
  prisma: true
  # Lot H — postinstall de protobufjs (dépendance transitive de l'exporter OTLP
  # via @grpc/grpc-js) : ne fait qu'un contrôle de version, aucun code natif —
  # false, l'exporter fonctionne à l'identique.
  protobufjs: false
  unrs-resolver: true
