name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pas de service Postgres pour l'instant : le test d'intégration de concurrence
# (invoice-numbering.service.integration.spec.ts) reste "skipped" tant que
# DATABASE_URL n'est pas fourni. Ajouter un service postgres:16 + DATABASE_URL
# quand la Tâche 5 (migration initiale) sera débloquée.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @facture-gn/db db:generate

      - run: pnpm turbo lint

      - run: pnpm turbo typecheck

      - run: pnpm turbo test
