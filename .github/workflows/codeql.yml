# Vague 0 (C1) — analyse statique de sécurité (SAST). Le code manipule des flux
# GNF, des secrets de webhook et des clés de certification : une injection ou une
# fuite de secret introduite par mégarde doit être signalée sur la PR, pas
# découverte en production.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "27 3 * * 1" # lundi 03h27 UTC — hebdo, décalé des heures rondes

jobs:
  analyze:
    name: Analyse CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyser
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
